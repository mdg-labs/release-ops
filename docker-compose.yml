services:
  release-ops:
    build: .
    image: ghcr.io/mdg-labs/release-ops:latest
    ports:
      - "3000:3000"
    volumes:
      - release-ops-data:/data
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env — see .env.example}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY in .env — see .env.example}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/go/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

volumes:
  release-ops-data:
