name: Release

on:
  release:
    types: [published]

jobs:
  push-image:
    permissions:
      packages: write
    uses: ./.github/workflows/build-and-push-image.yml
    with:
      # Build from the tagged commit, not the branch HEAD at publish time.
      ref: refs/tags/${{ github.event.release.tag_name }}
      tags: |
        latest
        ${{ github.event.release.tag_name }}
    secrets: inherit
