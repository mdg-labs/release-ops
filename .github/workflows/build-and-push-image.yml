name: Build and push images

on:
  workflow_call:
    inputs:
      tags:
        description: Newline-separated image tags (without registry prefix), applied to the app and the worker image
        required: true
        type: string
      ref:
        description: Optional checkout ref (commit, branch, or tag)
        required: false
        type: string
        default: ""
      version:
        description: Version stamped into both images (release tag or nightly-<short sha>); empty builds as dev
        required: false
        type: string
        default: ""

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: release-ops
            target: runtime
          - image: release-ops-worker
            target: worker
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Prepare image tags
        id: meta
        env:
          INPUT_TAGS: ${{ inputs.tags }}
        run: |
          image="ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}"
          tags=""
          while IFS= read -r tag; do
            tag="${tag//[[:space:]]/}"
            [ -z "$tag" ] && continue
            if [ -n "$tags" ]; then
              tags="${tags},"
            fi
            tags="${tags}${image}:${tag}"
          done <<< "$INPUT_TAGS"
          if [ -z "$tags" ]; then
            echo "No image tags provided" >&2
            exit 1
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            APP_VERSION=${{ inputs.version }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache,mode=max
