name: Build and push image

on:
  workflow_call:
    inputs:
      tags:
        description: Newline-separated image tags (without registry prefix)
        required: true
        type: string
      ref:
        description: Optional checkout ref (commit, branch, or tag)
        required: false
        type: string
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref != '' && inputs.ref || github.sha }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Prepare image tags
        id: meta
        env:
          INPUT_TAGS: ${{ inputs.tags }}
        run: |
          image="ghcr.io/${{ github.repository_owner }}/release-ops"
          tags=""
          while IFS= read -r tag; do
            tag="${tag//[[:space:]]/}"
            [ -z "$tag" ] && continue
            if [ -n "$tags" ]; then
              tags="${tags},"
            fi
            tags="${tags}${image}:${tag}"
          done <<< "$INPUT_TAGS"
          if [ -z "$tags" ]; then
            echo "No image tags provided" >&2
            exit 1
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/release-ops:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/release-ops:buildcache,mode=max
