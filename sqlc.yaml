version: "2"
sql:
  - engine: "sqlite"
    schema: "db/schema.sql"
    queries: "queries"
    gen:
      go:
        package: "db"
        out: "internal/store/db"
        sql_package: "database/sql"
        emit_json_tags: true
        overrides:
          # Sessions are matched and rewritten by a real user id only; the nullable column is
          # never read back as a row, so the parameters stay plain strings.
          - column: "sessions.user_id"
            go_type: "string"
