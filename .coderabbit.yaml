# CodeRabbit config for Release Ops, written by mdg-setup.
# Shared settings come from the org-wide central config (mdg-labs/coderabbit);
# this file holds only what differs. dev-diff.sh reads only this file's path_filters.
inheritance: true
tone_instructions: 'Be direct and specific. Focus on correctness, security, and spec compliance. Skip
  praise. Prefer concrete fixes over generic advice. When behaviour is undefined in docs/specs.html, flag
  it instead of inventing requirements.

  '
reviews:
  auto_review:
    base_branches: []
  path_filters:
  - '!**/.claude/**'
  - '!**/__snapshots__/**'
  - '!**/*.snap'
  - '!**/fixtures/**'
  - '!**/testdata/**'
  - '!**/vendor/**'
  - '!**/CHANGELOG.md'
  - '!internal/store/db/*.sql.go'
  - '!apps/docs/public/**'
  - '!docs/kaneo.openapi.json'
  - '!.agents/**'
  path_instructions:
  - path: '**/*'
    instructions: 'Release Ops polls GitHub, GitLab, Gitea, Forgejo, and Codeberg for new

      releases and creates tickets in configured integrations. Single-container

      app: Go API (cmd/server, internal/) + Next.js UI (apps/web). Auth lives

      in Go; the web app proxies API calls. Do not invent endpoints, fields, or

      IDs not defined in docs/specs.html. Prefer minimal, focused diffs.

      '
  - path: internal/api/**
    instructions: 'Go HTTP API (chi router). Review auth/session handling, input validation,

      error responses, and SQL injection risks. Credentials and integration

      tokens must never be logged. Handlers should stay thin; business logic

      belongs in internal/ packages. Match existing handler patterns and tests.

      '
  - path: internal/providers/**
    instructions: 'Source and ticket provider integrations. Check API error handling, rate

      limits, pagination, and idempotency for ticket creation. Validate that

      provider-specific quirks (GitLab vs GitHub vs Gitea-compatible) are handled

      correctly. Never persist or log raw API tokens.

      '
  - path: internal/poll/**
    instructions: 'Release polling scheduler and run logic. Watch for race conditions,

      duplicate ticket creation, missed releases, and incorrect semver/pre-release

      handling. Scheduler changes should be covered by tests.

      '
  - path: internal/store/**
    instructions: 'SQLite persistence via sqlc. Edit queries in queries/*.sql, not generated

      internal/store/db/*.sql.go. Review transaction boundaries, nullable

      columns, and encryption of stored credentials.

      '
  - path: queries/**
    instructions: 'sqlc query definitions. Ensure SQL matches db/schema.sql types and

      constraints. Prefer explicit column lists over SELECT *.

      '
  - path: db/schema.sql
    instructions: "Canonical DDL \u2014 source of truth for the database. Schema changes must be\nfollowed\
      \ by `make db-migration name=<slug>`; never hand-write migrations.\nEvery table must be declared\
      \ STRICT. Flag any breaking column/type changes\nand missing indexes on foreign keys.\n"
  - path: migrations/**
    instructions: 'Migrations must be generated from db/schema.sql by sqlite-migrate via

      `make db-migration name=<slug>`. Flag hand-edited or copy-pasted migration SQL

      and any edit to a migration that already exists (its checksum header must

      still match). Verify that CI `npm run db:check` would pass.

      '
  - path: apps/web/**
    instructions: "Next.js App Router + COSS UI + next-intl. Zero hardcoded user-facing\nstrings \u2014\
      \ all copy via message keys in apps/web/messages/en.json\n(eslint-plugin-i18next enforces this).\
      \ Use existing hooks/components\npatterns. Client components only when needed. API calls go through\
      \ the\nGo proxy route, not direct external calls.\n"
  - path: apps/web/messages/**
    instructions: 'next-intl message files. Keys use namespace.feature.element naming.

      Namespaces: common, auth, dashboard, repos, integrations, ticket-projects,

      notifications, settings. Keep keys stable; avoid duplicate strings.

      '
  - path: Dockerfile
    instructions: 'Single-image build for Go + Next.js. Check layer caching, non-root user,

      minimal attack surface, and that secrets are not baked into layers.

      '
  - path: docs/**
    instructions: 'Product spec and roadmap docs. Focus on accuracy vs implementation,

      broken links, and contradictions with docs/specs.html or db/schema.sql.

      Do not nitpick prose style.

      '
  - path: .github/**
    instructions: 'CI/CD workflows. Verify jobs match the local gate (go test/lint, web

      test/lint/typecheck, db:check). Avoid redundant or missing checks.

      '
  labeling_instructions:
  - label: api
    instructions: Go API, handlers, auth, polling, or provider changes under internal/ or cmd/.
  - label: web
    instructions: Next.js UI changes under apps/web/.
  - label: db
    instructions: Schema, migrations, or sqlc query changes.
  - label: docs
    instructions: Documentation-only changes under docs/ or apps/docs/.
  - label: ci
    instructions: GitHub Actions or CI script changes.
  - label: deps
    instructions: Dependency version bumps in go.mod, go.sum, or package.json.
  pre_merge_checks:
    title:
      mode: warning
      requirements: "Conventional Commits: <type>(<scope>)[#N]: <imperative summary>\nAllowed types: feat,\
        \ fix, chore, refactor, docs, test, ci, build, perf\nAllowed scopes: release-ops, api, db, config,\
        \ ci, docs, deps\nSubject \u226472 chars. Include [#N] GitHub issue number when task-linked.\n"
  tools:
    golangci-lint:
      enabled: true
    eslint:
      enabled: true
    hadolint:
      enabled: true
    gitleaks:
      enabled: true
    markdownlint:
      enabled: true
    shellcheck:
      enabled: true
knowledge_base:
  code_guidelines:
    file_patterns:
    - '**/.claude/rules/**'
    - CLAUDE.md
    - docs/specs.html
    - db/schema.sql
    - docs/stack.html
